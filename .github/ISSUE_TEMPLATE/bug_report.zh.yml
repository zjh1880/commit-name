---
name: Bug report / 缺陷报告
description: 反馈提交信息生成错误
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: commit-name 版本
      placeholder: 1.1.0
    validations:
      required: true
  - type: textarea
    id: diff
    attributes:
      label: Diff 或 patch
      description: 粘贴一段能复现错误建议的最小 diff。
      render: diff
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望的提交信息
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际生成的提交信息
    validations:
      required: true
---
